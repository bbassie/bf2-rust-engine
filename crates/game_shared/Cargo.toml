[package]
name = "game_shared"
description = "Code shared by client and server: network protocol, components and simulation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only headless-safe Bevy features here; rendering lives in the client crate.
bevy = { workspace = true, features = [
  "default_app",
  "std",
  "multi_threaded",
  "serialize",
  "bevy_mesh",
  "bevy_color",
] }
avian3d = { workspace = true, features = [
  "3d",
  "f32",
  "parry-f32",
  "parallel",
  "simd",
  "serialize",
] }
bevy_replicon = { workspace = true, features = ["client", "server"] }
serde.workspace = true
ron.workspace = true
anyhow.workspace = true
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }
game_data.workspace = true
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
# Content hashes for server content downloads. No default features: Bevy uses it that way too.
blake3 = { version = "1.8", default-features = false }
# Compression of generated caches (`cache`).
flate2.workspace = true
# Server identity keys and account tickets (the join handshake, `join`).
game_auth.workspace = true

[dev-dependencies]
# The wire format replicon uses, for round-trip tests of messages (`join`).
postcard = { version = "1", default-features = false, features = ["alloc"] }
