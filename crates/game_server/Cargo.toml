[package]
name = "game_server"
description = "Server authority: connections, spawning, game rules and bots. Runs headless as a dedicated server, or inside the client for listen servers and singleplayer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
  "default_app",
  "std",
  "multi_threaded",
  "serialize",
  "bevy_mesh",
  "bevy_color",
] }
avian3d = { workspace = true, features = ["3d", "f32", "parry-f32", "parallel", "simd"] }
bevy_replicon = { workspace = true, features = ["server"] }
bevy_replicon_renet = { workspace = true, features = ["server", "renet_netcode"] }
game_shared.workspace = true
game_data.workspace = true
clap.workspace = true
serde.workspace = true
ron.workspace = true
anyhow.workspace = true
fastrand = "2"
bytemuck.workspace = true
flate2.workspace = true
