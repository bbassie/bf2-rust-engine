[package]
name = "game_server"
description = "Server authority: connections, spawning, game rules and bots. Runs headless as a dedicated server, or inside the client for listen servers and singleplayer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[features]
# Per-system timings for `server --profile-ticks` (Bevy's tracing spans; see `profile.rs`).
# Kept out of the default build: it rebuilds Bevy with the `trace` feature.
profile = ["bevy/trace", "bevy/debug"]

[dependencies]
bevy = { workspace = true, features = [
  "default_app",
  "std",
  "multi_threaded",
  "serialize",
  "bevy_mesh",
  "bevy_color",
] }
avian3d = { workspace = true, features = ["3d", "f32", "parry-f32", "parallel", "simd"] }
bevy_replicon = { workspace = true, features = ["server"] }
bevy_replicon_renet = { workspace = true, features = ["server", "renet_netcode"] }
game_shared.workspace = true
game_data.workspace = true
clap.workspace = true
serde.workspace = true
ron.workspace = true
anyhow.workspace = true
fastrand = "2"
bytemuck.workspace = true
flate2.workspace = true
# Road meshes for vehicle navigation.
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
# Serves the server's content (mods, optionally the imported assets) to joining clients.
tiny_http = "0.12"
# Identity key, account tickets (`join`, `accounts`); heartbeats and stats to a master server.
game_auth.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
