[package]
name = "game_voice"
description = "Voice chat without an engine: the Opus codec, a jitter buffer with loss concealment, resampling, level metering and test input. Used by the client; tested on its own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# libopus 1.3.1 translated to Rust (c2rust): the reference codec without a C toolchain or
# CMake, so it builds the same on Windows MSVC, Linux and macOS. See `codec`.
unsafe-libopus = "0.2"
