[package]
name = "game_auth"
description = "Identity keys, signed account tokens and the master server's API types. No engine dependency: the master server, the game server and the client share it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
ron.workspace = true
# Server identity keys and the master's session tokens.
ed25519-dalek = "2"
getrandom = "0.3"
blake3 = { version = "1.8", default-features = false }
base64 = "0.22"
