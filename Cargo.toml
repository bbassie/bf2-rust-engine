[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/game_client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Engine
bevy = { version = "0.19.1", default-features = false }
avian3d = { version = "0.7", default-features = false }

# Networking
bevy_replicon = { version = "0.44", default-features = false }
bevy_replicon_renet = { version = "0.20", default-features = false }

# General
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
lewton = "0.10"
log = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# Internal
bf2_formats = { path = "crates/bf2_formats" }
bf2_import = { path = "crates/bf2_import" }
game_shared = { path = "crates/game_shared" }
game_data = { path = "crates/game_data" }
game_server = { path = "crates/game_server" }

# Bevy compiles slowly without optimizations and runs far too slowly in debug.
# Optimize dependencies, keep our own code quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipping builds: `cargo build --profile dist`. Slower to compile than `--release`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
